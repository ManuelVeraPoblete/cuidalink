# Server
server.port=8080
spring.application.name=cuidalink

# API prefix
server.servlet.context-path=/api/v1

# Variables de entorno locales opcionales (backend/.env, ignorado por git). Ver .env.example.
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cuidalink}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — en producción el esquema se aplica con schema.sql y Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — secreto obligatorio (mínimo 32 bytes). Generar con: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS — orígenes separados por coma. Vacío = ninguno (la app móvil no lo necesita).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Firebase (solo FCM — no auth)
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}

# Logging — NUNCA loguear datos sensibles
logging.level.com.cuidalink=INFO
